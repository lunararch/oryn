name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: apps/server/go.sum
      - name: Build server and updater
        working-directory: apps/server
        env:
          GOWORK: "off"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../../dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../../dist/oryn-server-${GOOS}-${GOARCH}${EXT}" ./cmd/oryn-server
          if [ "$GOOS" = "linux" ]; then
            go build -trimpath -ldflags "-s -w" \
              -o "../../dist/oryn-updater-${GOOS}-${GOARCH}" ./cmd/oryn-updater
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Build web application
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../../dist
          tar -czf "../../dist/oryn-web-${GITHUB_REF_NAME}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          tag = os.environ["TAG"]
          assets = {}
          for name in sorted(os.listdir(".")):
              if name in {"SHA256SUMS", "latest.json"}:
                  continue
              if not os.path.isfile(name):
                  continue
              with open(name, "rb") as handle:
                  digest = hashlib.sha256(handle.read()).hexdigest()
              assets[name] = {
                  "sha256": digest,
                  "size": os.path.getsize(name),
                  "url": f"https://github.com/lunararch/oryn/releases/download/{tag}/{name}",
              }

          manifest = {
              "version": tag.removeprefix("v"),
              "tag": tag,
              "releasedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "assets": assets,
              "desktop": {},
          }
          with open("latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          PY
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Oryn ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
